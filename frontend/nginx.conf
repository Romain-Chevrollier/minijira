server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interne de Docker : l'adresse du backend est recherchée à chaque requête.
    # Si nginx démarre avant le backend (redémarrage du PC), il ne plante pas.
    resolver 127.0.0.11 valid=10s;
    # Backend arrêté : répondre en erreur après 5 s au lieu de 30 s par défaut
    resolver_timeout 5s;
    set $backend http://backend:8000;

    # /api/... est relayé vers le backend sans le préfixe : /api/health -> /health,
    # exactement comme le proxy Vite en développement
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        # Se connecter au backend (même machine) est instantané : au-delà de 5 s, il est
        # arrêté. Sans cette limite (60 s), un déplacement de carte attendrait 40 s avant
        # d'être annulé. Le temps de réponse de l'API, lui, n'est pas limité.
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers du build : leur nom change à chaque version (index-DPu5kAg6.js),
    # le navigateur peut donc les garder en cache longtemps
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Toute autre adresse (/, /tickets/12...) renvoie l'application, qui affiche le bon écran.
    # index.html n'est jamais gardé en cache : on voit toujours la dernière version.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
