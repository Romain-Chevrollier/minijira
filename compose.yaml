services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: minijira
      POSTGRES_PASSWORD: minijira
      POSTGRES_DB: minijira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, au premier démarrage (volume vide)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minijira -d minijira"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
