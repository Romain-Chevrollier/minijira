services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: minijira
      POSTGRES_PASSWORD: minijira
      POSTGRES_DB: minijira
    # Ports réservés à cet ordinateur (IPv4 et IPv6) : aucun autre appareil du réseau
    # ne peut se connecter. Les deux adresses évitent à `localhost` un délai de
    # 2 secondes sous Windows. Vérifié en CI par .github/scripts/check-local-ports.jq
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, au premier démarrage (volume vide)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minijira -d minijira"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Relancé avec Docker Desktop (après un redémarrage du PC), sauf si on l'a arrêté
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # Entre conteneurs, la base s'appelle "db" (le nom du service), pas localhost
      DATABASE_URL: postgresql+psycopg://minijira:minijira@db:5432/minijira
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # L'API est prête quand /health répond (Python est déjà dans l'image)
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Tests et lint du backend, à la demande : `docker compose run --rm backend-tests`
  backend-tests:
    # Profil "test" : jamais démarré par `docker compose up`
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      # Les deux adresses visent la base de test : les tests ne peuvent pas
      # atteindre la base `minijira` qui contient les vrais tickets
      DATABASE_URL: postgresql+psycopg://minijira:minijira@db:5432/minijira_test
      TEST_DATABASE_URL: postgresql+psycopg://minijira:minijira@db:5432/minijira_test
    volumes:
      # Code partagé : une modification est prise en compte sans reconstruire l'image
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Sauvegarde des tickets, à la demande : `docker compose run --rm backup`
  # Crée backups/minijira-<date>.dump, sur l'ordinateur (survit à `down -v`)
  backup: &backup-tool
    # Profil "tools" : jamais démarré par `docker compose up`
    profiles: ["tools"]
    build:
      context: ./backend
      target: tools
    entrypoint: ["python", "-m", "scripts.backups", "save"]
    environment:
      DATABASE_URL: postgresql+psycopg://minijira:minijira@db:5432/minijira
      # Date des fichiers à l'heure française (les conteneurs sont à l'heure UTC)
      TZ: Europe/Paris
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Restauration : `docker compose run --rm restore` liste les sauvegardes,
  # `docker compose run --rm restore backups/<fichier>` restaure après confirmation
  restore:
    <<: *backup-tool
    entrypoint: ["python", "-m", "scripts.backups", "restore"]

  frontend:
    build: ./frontend
    ports:
      # Port d'accès : 80 par défaut (http://localhost), modifiable avec MINIJIRA_PORT
      - "127.0.0.1:${MINIJIRA_PORT:-80}:80"
      - "[::1]:${MINIJIRA_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
