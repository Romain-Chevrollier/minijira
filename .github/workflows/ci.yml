name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: minijira
          POSTGRES_PASSWORD: minijira
          POSTGRES_DB: minijira_test
        ports:
          - 5432:5432
        # GitHub attend que le service soit "healthy" avant de lancer les steps
        options: >-
          --health-cmd "pg_isready -U minijira -d minijira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # En CI la base est jetable : app et tests partagent la même. Son nom finit
      # par _test, sinon les tests refusent de démarrer (voir tests/db_guard.py)
      DATABASE_URL: postgresql+psycopg://minijira:minijira@localhost:5432/minijira_test
      TEST_DATABASE_URL: postgresql+psycopg://minijira:minijira@localhost:5432/minijira_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          # Même version de Node qu'en local, lue dans frontend/.nvmrc
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci installe exactement les versions de package-lock.json (comme uv sync --locked)
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Le build vérifie aussi les types TypeScript
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Échoue si un port de compose.yaml est de nouveau ouvert à tout le réseau
      - name: Vérifier que les ports sont réservés à l'ordinateur local
        run: docker compose --profile '*' config --format json | jq -r -f .github/scripts/check-local-ports.jq
      # Le lancement en une commande : construit les images, démarre tout
      # et attend que chaque service soit prêt (healthy)
      - run: docker compose up -d --build --wait
      - name: Vérifier qu'on se connecte en local, mais pas par l'adresse réseau
        run: |
          network_ip=$(hostname -I | awk '{print $1}')
          echo "Adresse réseau de la machine : $network_ip"
          for port in 80 8000 5432; do
            for address in 127.0.0.1 ::1; do
              timeout 3 bash -c "</dev/tcp/$address/$port" \
                || { echo "::error::$address:$port ne répond pas"; exit 1; }
            done
            if timeout 3 bash -c "</dev/tcp/$network_ip/$port" 2>/dev/null; then
              echo "::error::le port $port répond sur l'adresse réseau $network_ip"
              exit 1
            fi
          done
          echo "OK : 80, 8000 et 5432 répondent en local et refusent l'adresse réseau"
      - name: Vérifier l'application à travers nginx
        run: |
          curl --fail --silent http://localhost/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost/api/health | grep -q '"status":"ok"'
          curl --fail --silent http://localhost/api/tickets | grep -q '^\['
          # Les adresses de l'application (vues et popups) renvoient bien la page
          curl --fail --silent http://localhost/tickets/1 | grep -q '<div id="root">'
          curl --fail --silent http://localhost/liste | grep -q '<div id="root">'
          curl --fail --silent http://localhost/liste/tickets/1 | grep -q '<div id="root">'
      # Les tests du backend tels qu'on les lance en local, dans leur conteneur
      - name: Lancer les tests du backend dans Docker
        run: docker compose run --rm backend-tests
      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Arrêter et supprimer les conteneurs
        if: always()
        run: docker compose down -v
